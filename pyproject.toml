[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "text-hygiene"
version = "0.1.0"
description = "Detect and strip invisible Unicode from text."
requires-python = ">=3.10"
dependencies = []
license = "MIT"
readme = "README.md"
keywords = ["unicode", "zero-width", "text", "linter", "bidi"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing",
]

[project.scripts]
text-hygiene = "texthygiene.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
texthygiene = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 90

[tool.ruff.lint]
# Pinned so CI does not drift when ruff changes its defaults.
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
